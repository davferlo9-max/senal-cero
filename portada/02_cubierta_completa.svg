<?xml version="1.0" encoding="UTF-8"?>
<!-- CUBIERTA COMPLETA · SEÑAL CERO · REDISEÑO MODERNO/JUVENIL
     Tapa blanda KDP 12,7 x 20,32 cm (5x8"), 170 pág., lomo 9,72 mm
     Lienzo con sangrado: 3190 x 2475 px @300dpi
     Orden: CONTRAPORTADA | LOMO | PORTADA -->
<svg xmlns="http://www.w3.org/2000/svg" width="3190" height="2475" viewBox="0 0 3190 2475">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#2b1055"/><stop offset="38%" stop-color="#6d2b7a"/>
      <stop offset="68%" stop-color="#c13b76"/><stop offset="100%" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/><stop offset="60%" stop-color="#14263d"/><stop offset="100%" stop-color="#1b3a5c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166"/><stop offset="100%" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="mt1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d6a8f"/><stop offset="100%" stop-color="#14263d"/>
    </linearGradient>
    <clipPath id="pc"><rect x="2210" y="760" width="620" height="1040" rx="60"/></clipPath>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <!-- Fondo continuo -->
  <rect width="3190" height="2475" fill="url(#bg)"/>
  <!-- curvas de nivel sutiles en toda la cubierta -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.08">
    <path d="M-50 300 Q800 180 1600 320 T3250 280"/>
    <path d="M-50 360 Q800 250 1600 390 T3250 350"/>
    <path d="M-50 2180 Q800 2060 1600 2210 T3250 2160"/>
    <circle cx="520" cy="1250" r="150"/><circle cx="520" cy="1250" r="210"/><circle cx="520" cy="1250" r="275"/>
    <circle cx="2680" cy="1500" r="130"/><circle cx="2680" cy="1500" r="190"/>
  </g>

  <!-- ===================== PORTADA (derecha) x 1653..3190 ===================== -->
  <g>
    <text x="2420" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="44" letter-spacing="12" fill="#ffffff">DAVID FERNÁNDEZ</text>
    <text x="2420" y="440" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="230" letter-spacing="-6" fill="#ffffff">SEÑAL</text>

    <!-- móvil -->
    <rect x="2192" y="742" width="656" height="1076" rx="80" fill="#0a0a12"/>
    <rect x="2192" y="742" width="656" height="1076" rx="80" fill="none" stroke="#00e5ff" stroke-width="5" opacity="0.65"/>
    <rect x="2210" y="760" width="620" height="1040" rx="60" fill="url(#screen)"/>
    <g clip-path="url(#pc)">
      <circle cx="2520" cy="1150" r="130" fill="url(#sun)"/>
      <circle cx="2520" cy="1150" r="185" fill="#ffd166" opacity="0.18" filter="url(#soft)"/>
      <path d="M2210 1500 L2320 1320 L2440 1450 L2540 1260 L2660 1440 L2770 1300 L2830 1390 L2830 1800 L2210 1800 Z" fill="url(#mt1)"/>
      <path d="M2210 1630 L2300 1520 L2420 1620 L2540 1490 L2680 1630 L2790 1520 L2830 1580 L2830 1800 L2210 1800 Z" fill="#0b1826"/>
      <g fill="#05070a">
        <g transform="translate(2490,1600)"><circle r="6"/><rect x="-4" y="5" width="9" height="23" rx="3"/></g>
        <g transform="translate(2514,1607)"><circle r="6"/><rect x="-4" y="5" width="9" height="21" rx="3"/></g>
        <g transform="translate(2538,1602)"><circle r="6"/><rect x="-4" y="5" width="9" height="24" rx="3"/></g>
        <g transform="translate(2562,1608)"><circle r="5"/><rect x="-4" y="5" width="9" height="20" rx="3"/></g>
        <g transform="translate(2584,1603)"><circle r="6"/><rect x="-4" y="5" width="9" height="23" rx="3"/></g>
      </g>
    </g>
    <!-- barra de estado -->
    <g transform="translate(2245,798)">
      <g fill="#3a4a5a"><rect x="0" y="18" width="10" height="10"/><rect x="15" y="11" width="10" height="17"/><rect x="30" y="4" width="10" height="24"/><rect x="45" y="-2" width="10" height="30"/></g>
      <line x1="-5" y1="30" x2="60" y2="-7" stroke="#ff4d4d" stroke-width="5" stroke-linecap="round"/>
      <text x="75" y="24" font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="#ff6b6b" letter-spacing="1">SIN SERVICIO</text>
      <text x="540" y="24" text-anchor="end" font-family="Arial, sans-serif" font-size="26" fill="#5a6a7a">0%</text>
    </g>
    <!-- CERO con el 0 de barras -->
    <text x="2360" y="2110" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="230" letter-spacing="-4" fill="#00e5ff">CER</text>
    <g transform="translate(2610,2030)"><circle r="82" fill="none" stroke="#00e5ff" stroke-width="38"/><rect x="-13" y="-135" width="26" height="62" fill="#ff7a59"/></g>
    <!-- chip tagline -->
    <rect x="2080" y="2180" width="680" height="60" rx="30" fill="#00e5ff"/>
    <text x="2420" y="2221" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="30" letter-spacing="2" fill="#10121f">17 DÍAS · CERO COBERTURA · SALIR JUNTOS</text>
  </g>

  <!-- ===================== LOMO x 1537..1653 ===================== -->
  <rect x="1537" y="0" width="116" height="2475" fill="#0a0a12"/>
  <text x="1595" y="1238" text-anchor="middle" transform="rotate(90 1595 1238)" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="54" letter-spacing="2" fill="#ffffff">SEÑAL CERO</text>
  <text x="1595" y="1238" text-anchor="middle" transform="rotate(90 1595 1238)" dx="420" font-family="Arial, sans-serif" font-size="32" fill="#00e5ff">D. FERNÁNDEZ</text>

  <!-- ===================== CONTRAPORTADA x 0..1537 ===================== -->
  <g>
    <!-- panel oscuro translúcido -->
    <rect x="150" y="300" width="1240" height="1680" rx="40" fill="#10101f" opacity="0.72"/>
    <!-- borde cian fino -->
    <rect x="150" y="300" width="1240" height="1680" rx="40" fill="none" stroke="#00e5ff" stroke-width="3" opacity="0.5"/>

    <!-- gancho triple -->
    <text x="770" y="470" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="80" fill="#00e5ff">NO HAY ADULTOS.</text>
    <text x="770" y="572" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="80" fill="#ff7a59">NO HAY COBERTURA.</text>
    <text x="770" y="674" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="80" fill="#ffffff">NO HAY UN PLAN.</text>

    <g font-family="Georgia, serif" font-size="46" fill="#eaeaea">
      <text x="230" y="830">Cuando el autobús del campamento se sale de</text>
      <text x="230" y="892">la carretera y rueda ladera abajo, Nora</text>
      <text x="230" y="954">descubre dos cosas a la vez: que ha</text>
      <text x="230" y="1016">sobrevivido, y que sus listas, sus apps y su</text>
      <text x="230" y="1078">manía de controlarlo todo no valen nada</text>
      <text x="230" y="1140">cuando el móvil marca «Sin servicio».</text>
      <text x="230" y="1250">Atrapada con las tres personas que menos</text>
      <text x="230" y="1312">soporta de su clase, le quedan diecisiete</text>
      <text x="230" y="1374">días, una cuchara, un paquete de gusanitos</text>
      <text x="230" y="1436">y una única forma de salir con vida:</text>
    </g>
    <text x="230" y="1540" font-family="Georgia, serif" font-weight="bold" font-style="italic" font-size="52" fill="#00e5ff">aprender a confiar en los demás.</text>
    <text x="230" y="1628" font-family="Georgia, serif" font-style="italic" font-size="46" fill="#ff7a59">Qué horror.</text>

    <g font-family="Georgia, serif" font-style="italic" font-size="34" fill="#c9c9c9">
      <text x="770" y="1750" text-anchor="middle">Una aventura de supervivencia trepidante y con</text>
      <text x="770" y="1796" text-anchor="middle">mucho humor, para lectores de Hatchet y para</text>
      <text x="770" y="1842" text-anchor="middle">quien se haya preguntado qué haría si el mundo</text>
      <text x="770" y="1888" text-anchor="middle">dejara, de golpe, de responder.</text>
    </g>

    <!-- zona ISBN -->
    <rect x="1070" y="2120" width="380" height="220" rx="10" fill="#ffffff" opacity="0.92"/>
    <text x="1260" y="2240" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#333">ISBN / código</text>
    <text x="1260" y="2280" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#333">(lo pone KDP)</text>

    <text x="230" y="2232" font-family="Arial, sans-serif" font-weight="700" font-size="34" fill="#00e5ff">FICCIÓN JUVENIL · AVENTURA</text>
    <text x="230" y="2284" font-family="Arial, sans-serif" font-weight="700" font-size="34" fill="#00e5ff">A PARTIR DE 12 AÑOS</text>
  </g>

  <!-- Guías de corte/lomo (OCULTAR antes de exportar) -->
  <g stroke="#00e5ff" stroke-width="2" stroke-dasharray="14 10" opacity="0.4" fill="none">
    <rect x="37.5" y="37.5" width="3115" height="2400"/>
    <line x1="1537" y1="0" x2="1537" y2="2475"/>
    <line x1="1653" y1="0" x2="1653" y2="2475"/>
  </g>
</svg>
